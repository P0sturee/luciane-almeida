name: Baixar mídias e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  midias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install --quiet pillow
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Baixar mídias do Higgsfield para assets/
        run: python scripts/baixar_midias.py

      - name: Salvar no repositório e atualizar o site (gh-pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Adiciona mídias do Higgsfield em assets/"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages --force
