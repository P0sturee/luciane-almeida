<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>Estúdio de Coloração · Luciane Almeida</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%231F2A44%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Georgia,serif%27 font-style=%27italic%27 font-size=%2734%27 fill=%27%23F6F5F2%27 text-anchor=%27middle%27%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Protótipo: tudo fica salvo só neste aparelho (IndexedDB). Sem servidor. */
:root{--pri:#1F2A44;--pri-d:#121A2E;--pri-l:#2F3F66;--soft:#CBD3EA;--key:#B0125B;--creme:#ECEAE6;--creme-2:#F6F5F2;--areia:#D9D7D2;--tinta:#1B1A1F;--muted:#6B6A72;--ok:#2F8F5B;--warn:#B7791F;
  --f-d:'Cormorant Garamond',Georgia,'Times New Roman',serif;--f-b:'Jost',system-ui,-apple-system,sans-serif;--f-s:'Cormorant Garamond',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--areia);color:var(--tinta);font-family:var(--f-b);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
#app{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--creme-2);padding:max(18px,env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));position:relative;overflow-x:hidden}
.sig{font-family:var(--f-s);font-style:italic;font-weight:500;font-size:34px;line-height:1;color:var(--pri)}
.brandbar{display:flex;width:96px;height:4px;border-radius:2px;overflow:hidden;margin:8px 0 6px}
.brandbar i{flex:1}
.up{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-d);font-weight:600;font-size:38px;line-height:1.02;color:var(--pri)}
.h{font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;color:var(--tinta);margin:26px 0 12px}
.m{color:var(--muted);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:44px}
.bar b{font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px -4px rgba(27,21,23,.4);flex:none}
.ib svg{width:22px;height:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:27px;background:var(--pri);color:#fff;font-weight:500;font-size:16px;text-align:center;box-shadow:0 10px 22px -12px rgba(27,21,23,.7)}
a.btn{text-decoration:none}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--areia)}
.btn.soft{background:#fff;color:var(--pri);box-shadow:0 2px 10px -6px rgba(27,21,23,.5)}
.btn[disabled]{opacity:.5}
.stack{display:grid;gap:10px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 22px -18px rgba(27,21,23,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-d);font-weight:600;font-size:30px;line-height:1;color:var(--pri);white-space:nowrap}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.2}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 8px 22px -18px rgba(27,21,23,.6)}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:13px;color:var(--muted)}
.av{width:48px;height:64px;border-radius:50%;overflow:hidden;background:var(--areia);display:grid;place-items:center;font-weight:600;color:var(--pri);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:84px;height:112px;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--pri)}
.chip{font-size:11px;font-weight:500;padding:5px 10px;border-radius:999px;flex:none;white-space:nowrap}
.chip.a{background:#F3E7D3;color:#8A5A12}.chip.b{background:#E6ECF7;color:#2F4F8F}.chip.c{background:#E3F1E7;color:#256B45}.chip.d{background:#EFE6F5;color:#6A3D8F}
.tabs{display:flex;gap:6px;background:var(--creme);border-radius:999px;padding:5px;margin:16px 0}
.tabs button{flex:1;height:40px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px -4px rgba(27,21,23,.4)}
.who{display:flex;align-items:center;gap:16px;margin:6px 4px 0}
.who h1{font-size:22px;font-weight:600;line-height:1.15}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 2px 6px}
.inp{width:100%;min-height:50px;border-radius:14px;border:1.5px solid #E3D8CD;background:#fff;padding:12px 14px;font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.chk{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:15px}
.chk input{width:24px;height:24px;accent-color:var(--pri);flex:none}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}
.pal i{aspect-ratio:1;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pills span{font-size:12px;background:var(--creme);padding:5px 10px;border-radius:999px}
.pills b{font-weight:600}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:14px}
.steps{counter-reset:s;display:grid;gap:8px;margin:12px 0 4px}
.steps li{list-style:none;counter-increment:s;display:flex;gap:10px;font-size:14px;align-items:flex-start}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--key);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px}
.link{display:block;margin:16px auto 0;font-size:14px;color:var(--muted);text-decoration:underline;padding:8px}

/* login */
.login{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.login .sig{font-size:48px}
.login .brandbar{margin:14px auto 10px}
.dots{display:flex;gap:16px;margin:30px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}
.dots i.on{background:var(--pri)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:22px}
.pad button{width:72px;height:72px;border-radius:50%;background:#fff;font-size:26px;font-weight:500;box-shadow:0 4px 12px -8px rgba(27,21,23,.6)}
.pad button:active{background:var(--soft)}
.pad .x{background:none;box-shadow:none;font-size:14px;color:var(--muted)}

/* foto no oval */
#al-area{position:relative;width:min(100%,340px);aspect-ratio:3/4;margin:0 auto;border-radius:22px;overflow:hidden;background:#cfc7be;touch-action:none;cursor:grab}
#al-area.wb{cursor:crosshair;box-shadow:0 0 0 4px var(--warn)}
#al-img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
#al-area svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.zoom{display:flex;align-items:center;gap:12px;margin:16px 4px}
.zoom input{flex:1;accent-color:var(--pri);height:32px}

/* oval + cores */
.ov{display:block;aspect-ratio:3/4;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 10px 24px -10px rgba(0,0,0,.5);background:#ddd}
.ov img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp{display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:22px;padding:0 0 12px;background:#fff;overflow:hidden;box-shadow:0 8px 22px -18px rgba(27,21,23,.6)}
.cmp .sw{width:100%;aspect-ratio:3/4.4;display:grid;place-items:center;background:var(--bg)}
.cmp .ov{width:66%}
.cmp b{font-size:17px;font-weight:600}
.cmp.sel{box-shadow:0 0 0 4px var(--ok)}
.prog{display:flex;gap:4px;margin:4px 0 14px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--areia)}
.prog i.on{background:var(--key)}
.q{font-family:var(--f-d);font-weight:600;font-size:38px;line-height:1.02;color:var(--pri)}
.drape{position:relative;width:100%;aspect-ratio:1;border-radius:26px;display:grid;place-items:center;overflow:hidden;box-shadow:0 14px 30px -18px rgba(27,21,23,.7)}
.drape .ov{width:46%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 6px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 14px;border-radius:999px;border:1.5px solid var(--areia);font-size:13px;white-space:nowrap;background:#fff}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:10px}
.sws button{aspect-ratio:1;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sws button.on{box-shadow:0 0 0 3px var(--creme-2),0 0 0 5px var(--pri)}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:18px;padding:12px 14px}
.srow b{flex:1;font-weight:600;font-size:15px}
.srow span{display:flex;gap:3px}
.srow i{width:16px;height:28px;border-radius:4px}
.srow.on{box-shadow:0 0 0 3px var(--pri)}
.srow em{font-style:normal;font-size:11px;color:var(--warn);font-weight:600}

/* ficha e looks por ocasião */
.seg{display:flex;gap:8px}
.seg button{flex:1;height:48px;border-radius:14px;background:#fff;border:1.5px solid var(--areia);font-size:15px}
.seg button.on,.tg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg button{padding:10px 14px;border-radius:999px;border:1.5px solid var(--areia);background:#fff;font-size:14px}
.lk{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.lk span{display:flex;align-items:center;gap:7px;font-size:13.5px}
.lk i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);flex:none}

/* editor de cartelas */
.ed{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cin{-webkit-appearance:none;appearance:none;border:0;padding:0;width:100%;height:60px;border-radius:12px;background:none;cursor:pointer;display:block}
.cin::-webkit-color-swatch-wrapper{padding:0}
.cin::-webkit-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:12px}
.cin::-moz-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:12px}
.thm{display:flex;gap:12px;margin-top:6px}
.thm button{flex:1;display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted);padding:10px 4px;border-radius:16px;background:#fff}
.thm i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 4px #fff,0 0 0 1px rgba(0,0,0,.15)}
.thm button.on{box-shadow:0 0 0 2px var(--pri);color:var(--tinta)}

/* materiais */
.pages{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:6px 18px 14px;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pages img{flex:none;width:78%;border-radius:8px;box-shadow:0 14px 30px -16px rgba(27,21,23,.7);scroll-snap-align:center;background:#fff}
.pages.story img{width:58%;border-radius:18px}
.load{display:grid;place-items:center;gap:14px;padding:70px 0;color:var(--muted)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--areia);border-top-color:var(--pri);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* looks */
.pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--creme)}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc.add{display:grid;place-items:center;border:2px dashed #D3C4B6;color:var(--pri);font-size:30px;background:#fff}
.pc.on{box-shadow:0 0 0 4px var(--ok)}
.pc.on::after{content:"✓";position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;display:grid;place-items:center}
.colg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:112px;height:112px;border-radius:14px;overflow:hidden;flex:none;background:var(--creme)}
.colg img{width:100%;height:100%;object-fit:cover;min-height:0}
.colg.n1{grid-template-columns:1fr}
.colg.n3 img:first-child{grid-row:span 2}
.look{display:flex;gap:14px;align-items:flex-start}
.look div{flex:1;min-width:0}
.look b{font-weight:600}
.look p{font-size:14px;color:var(--muted);margin-top:4px}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tinta);color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;max-width:min(90vw,420px);text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const st = (s, m) => db.transaction(s, m).objectStore(s);
  return {
    async open() { try { const r = indexedDB.open('lu-estudio', 1); r.onupgradeneeded = () => { r.result.createObjectStore('clients', { keyPath: 'id' }); r.result.createObjectStore('kv'); }; db = await req(r); } catch (e) { db = null; } },
    all: () => db ? req(st('clients', 'readonly').getAll()) : Promise.resolve([...mem.clients.values()]),
    put: c => db ? req(st('clients', 'readwrite').put(c)) : Promise.resolve(mem.clients.set(c.id, c)),
    del: id => db ? req(st('clients', 'readwrite').delete(id)) : Promise.resolve(mem.clients.delete(id)),
    get: k => db ? req(st('kv', 'readonly').get(k)) : Promise.resolve(mem.kv.get(k)),
    set: (k, v) => db ? req(st('kv', 'readwrite').put(v, k)) : Promise.resolve(mem.kv.set(k, v))
  };
})();
